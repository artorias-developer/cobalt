[project]
name = "cobalt-backend"
version = "1.11.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles",
    "aiohttp",
    "aioshutil",
    "alembic",
    "APScheduler",
    "asyncpg",
    "bcrypt",
    "fastapi",
    "httptools",
    "lxml",
    "opentelemetry-api",
    "orjson",
    "psutil",
    "pycryptodome",
    "pydantic",
    "python-multipart",
    "redis",
    "SQLAlchemy[asyncio]",
    "stream-inflate",
    "stream-unzip",
    "stream-zip",
    "structlog",
    "tzlocal",
    "uvicorn",
    "uvloop",
    "websockets",
]

[dependency-groups]
dev = [
    "pydevd-pycharm",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
package = false
